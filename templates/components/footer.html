{% load i18n hospital_tags %}
<!-- Streamlined Lightweight Footer -->
<footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 backdrop-blur-sm py-3 text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
        <!-- Left: Clean Copyright & Law Notice -->
        <div class="flex items-center gap-2 text-center sm:text-left">
            <span class="font-bold text-brand-600 dark:text-brand-400">{{ HOSPITAL.NAME }}</span>
            <span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span>
            <span class="text-[11px] text-slate-500 dark:text-slate-400">{% trans "Conforme Loi n°2010/012 (Cameroun)" %}</span>
        </div>

        <!-- Right: Status Indicator, Timezone, Security -->
        <div class="flex items-center gap-4 text-[11px]">
            <span class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-medium">
                <i class="fa-solid fa-circle-check text-xs"></i>
                {% trans "Données Médicales Sécurisées" %}
            </span>
            <span class="text-slate-300 dark:text-slate-700">•</span>
            <span class="inline-flex items-center gap-1.5 font-mono text-slate-600 dark:text-slate-300">
                <i class="fa-solid fa-clock text-slate-400"></i>
                Africa/Douala
            </span>
        </div>
    </div>
</footer>
