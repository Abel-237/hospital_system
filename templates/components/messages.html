{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
    {% for message in messages %}
    <div class="mb-3 p-4 rounded-xl text-sm font-medium flex items-center justify-between border shadow-sm transition-all duration-200
        {% if message.tags == 'success' %}
            bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800
        {% elif message.tags == 'error' %}
            bg-red-50 dark:bg-red-950/40 text-red-800 dark:text-red-300 border-red-200 dark:border-red-800
        {% elif message.tags == 'warning' %}
            bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800
        {% else %}
            bg-blue-50 dark:bg-blue-950/40 text-blue-800 dark:text-blue-300 border-blue-200 dark:border-blue-800
        {% endif %}"
        x-data="{ show: true }" x-show="show">
        <div class="flex items-center gap-3">
            <span class="text-base shrink-0">
                {% if message.tags == 'success' %}
                    <i class="fa-solid fa-circle-check text-emerald-500"></i>
                {% elif message.tags == 'error' %}
                    <i class="fa-solid fa-circle-xmark text-red-500"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info text-blue-500"></i>
                {% endif %}
            </span>
            <span>{{ message }}</span>
        </div>
        <button @click="show = false" class="text-xs opacity-60 hover:opacity-100 font-bold ml-4 p-1 hover:bg-black/5 rounded">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
