[project]
name = "hospital_system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    # ajoute ici toutes tes autres dépendances
    # (djangorestframework, psycopg2-binary, gunicorn, etc.)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --nomigrations"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "migrations",
    ".venv",
    "venv",
    "static",
    "media",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '/(\.git|\.venv|migrations)/'